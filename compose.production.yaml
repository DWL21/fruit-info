name: fruit-info-production
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    # 서버의 ubuntu 사용자로 실행해 Codex 로그인 정보를 함께 쓴다.
    user: "1000:1000"
    env_file: /etc/fruit-info/api.env
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://fruit-api.simplyimg.com
      CORS_ORIGINS: https://fruit.simplyimg.com,https://fruit-info.pages.dev
      ANALYZER: codex
      CODEX_BIN: /usr/local/bin/codex
      CODEX_HOME: /codex-home
      CODEX_MODEL: gpt-6.1-sol
      ANALYZE_CONCURRENCY: "2"
    volumes:
      - /var/lib/fruit-info:/data
      - /home/ubuntu/.codex:/codex-home
      - /home/ubuntu/.local/bin/codex:/usr/local/bin/codex:ro
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
